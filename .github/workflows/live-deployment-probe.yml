name: VidGravity Live Deployment Probe

on:
  push:
    branches:
      - main
      - "fix/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidgravity-live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe public backend and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe configured public HTTPS backend
        run: python p169_deployment_probe.py --url https://vidgravity.onrender.com
      - name: Verify live Story export route is deployed
        run: |
          python - <<'PY'
          import urllib.error, urllib.request
          url = "https://vidgravity.onrender.com/api/media/export"
          req = urllib.request.Request(
              url, data=b"", method="POST",
              headers={"Content-Type": "video/mp4", "User-Agent": "VidGravity-Export-Route-Probe/1.0"}
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  status = response.status
                  body = response.read(2048).decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              status = exc.code
              body = exc.read(2048).decode("utf-8", "replace")
          # An empty POST must be rejected by the application (400); 404 means
          # the deployed companion is stale or its route is not mounted.
          if status == 404:
              raise SystemExit("Story export route is missing from the live backend (HTTP 404). Redeploy the companion.")
          if status not in (400, 403, 413, 429):
              raise SystemExit(f"Unexpected export-route probe status HTTP {status}: {body[:300]}")
          print(f"Story export route is mounted: HTTP {status} for intentionally empty probe")
          PY
      - name: Verify PWA origin serves the app
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://vidgravity-web.revanthbesty.workers.dev/"
          req = urllib.request.Request(url, headers={"User-Agent": "VidGravity-PWA-Smoke/1.0"})
          with urllib.request.urlopen(req, timeout=12) as response:
              body = response.read(1024 * 1024 + 1)
              content_type = response.headers.get("Content-Type", "")
              if not 200 <= response.status < 300:
                  raise SystemExit(f"PWA returned HTTP {response.status}")
              if "text/html" not in content_type.lower():
                  raise SystemExit(f"PWA content type is not HTML: {content_type}")
              if len(body) > 1024 * 1024:
                  raise SystemExit("PWA homepage exceeded 1 MiB")
              if b"VidGravity" not in body:
                  raise SystemExit("PWA homepage is missing the VidGravity marker")
              print(f"PWA smoke test passed: HTTP {response.status}, {content_type}, {len(body)} bytes")
          PY
      - name: Upload sanitized backend probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidgravity-live-deployment-probe
          path: P169_DEPLOYMENT_PROBE_REPORT.json
          if-no-files-found: ignore
          retention-days: 14
