name: Deploy VidGravity WPA to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/cloudflare-wpa-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vidgravity-wpa-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production WPA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure repository Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying."
            exit 1
          fi
      - name: Deploy WPA assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy --config wrangler.jsonc
      - name: Smoke-test deployed WPA assets
        shell: bash
        run: |
          python - <<'PY'
          import time
          import urllib.request

          base = "https://vidgravity-web.revanthbesty.workers.dev"
          checks = {
              "/": [b'id="playerKeyboardHelp"', b'data-share-target="bluesky"', b'id="copySelectedNames"', b"app.js?v=p176"],
              "/app.js?v=p176": [b"function copySelectedNames", b"video.currentTime+(key==='ArrowRight'?5:-5)", b"function shareTo"],
              "/styles.css?v=p180": [b".playerKeyboardHelp", b".shareTargets{display:grid", b".vg-queue-tools"],
              "/quickflow.js?v=qf1": [b"vgPasteUrl", b"vgQueueSearch", b"Duplicate active download avoided."],
          }
          last_error = None
          for attempt in range(1, 9):
              try:
                  for path, markers in checks.items():
                      request = urllib.request.Request(base + path, headers={"Cache-Control": "no-cache", "User-Agent": "VidGravity-Deploy-Smoke/1.0"})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          body = response.read(2 * 1024 * 1024 + 1)
                          if not 200 <= response.status < 300:
                              raise RuntimeError(f"{path} returned HTTP {response.status}")
                          if len(body) > 2 * 1024 * 1024:
                              raise RuntimeError(f"{path} exceeded 2 MiB")
                          missing = [marker.decode() for marker in markers if marker not in body]
                          if missing:
                              raise RuntimeError(f"{path} missing expected markers: {missing}")
                  print("Production WPA smoke test passed: homepage, JavaScript, CSS, library actions, player shortcuts, and social sharing are present.")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 8:
                      raise
                  print(f"Smoke test attempt {attempt} not ready yet: {exc}")
                  time.sleep(3)
          PY
