name: VidGravity CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media extraction dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Deno JavaScript runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify YouTube extraction prerequisites
        run: |
          yt-dlp --version
          deno --version
          python -c "import yt_dlp_ejs; print('yt-dlp-ejs available')"
      - name: Install FFmpeg integration-test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Creator media pipeline plan regression tests
        run: deno test --sloppy-imports engines/media/tests/pipeline_plans_test.ts
      - name: Real FFmpeg derivative render integration tests
        run: deno test --sloppy-imports --allow-run --allow-read --allow-write engines/media/tests/ffmpeg_integration_test.ts
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python regression suite
        run: python run_regression_p165.py
      - name: P169 deployment probe unit tests
        run: python -m unittest -v test_p169_deployment_probe.py
      - name: P170 unified release acceptance tests
        run: python -m unittest -v test_p170_release_acceptance.py
      - name: P171 operator preflight unit tests
        run: python -m unittest -v test_p171_operator_preflight.py
      - name: P172 production deployment bundle unit tests
        run: python -m unittest -v test_p172_deployment_bundle.py
      - name: Generate P171 operator preflight report (environment gates may remain blocked)
        shell: bash
        run: |
          set +e
          python p171_operator_preflight.py
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          echo "P171 may remain blocked until run on the actual deployment host with required configuration."
      - name: Generate unified P170 acceptance report (no live network requests)
        shell: bash
        run: |
          set +e
          python p170_release_acceptance.py
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          echo "P170 is expected to remain blocked until external release evidence passes."
      - name: Direct media download regression tests
        run: python -m unittest -v test_download_job_direct.py
      - name: YouTube extractor configuration regression tests
        run: python -m unittest -v test_youtube_extractor_config.py
      - name: QuickFlow usability regression checks
        run: python -m unittest -v test_quickflow_features.py
      - name: Web, export and fixture cleanup regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: JavaScript syntax checks for every shipped frontend
        run: |
          for script in ./*.js site/*.js android-web/*.js; do
            node --check "$script"
          done
      - name: Inline JavaScript syntax checks for shipped HTML pages
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.capture=False; self.current=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and not dict(attrs).get('src'):
                      self.capture=True; self.current=[]
              def handle_data(self, data):
                  if self.capture: self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.capture:
                      self.scripts.append(''.join(self.current)); self.capture=False
          import subprocess, tempfile
          for page in ('index.html','site/index.html','android-web/index.html'):
              parser=Scripts(); parser.feed(Path(page).read_text(encoding='utf-8'))
              for i, script in enumerate(parser.scripts):
                  if not script.strip(): continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                      f.write(script); name=f.name
                  print(f'Checking {page} inline script {i+1}')
                  subprocess.run(['node','--check',name],check=True)
          PY
      - name: Generate release preflight (external gates may remain blocked)
        shell: bash
        run: |
          set +e
          python p164_release_preflight.py
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          echo "Preflight report result is informational here; public release remains blocked until external gates pass."
      - name: Upload test and preflight reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidgravity-ci-reports
          path: |
            P165_CI_TEST_REPORT.json
            P165_CI_TEST_OUTPUT.txt
            P164_RELEASE_PREFLIGHT_REPORT.json
            P169_DEPLOYMENT_PROBE_REPORT.json
            P170_RELEASE_ACCEPTANCE_REPORT.json
            P171_OPERATOR_PREFLIGHT_REPORT.json
            P172_DEPLOYMENT_BUNDLE_REPORT.json
          if-no-files-found: warn


  android-share-pipeline:
    name: Android share pipeline and social export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build native Android APK
        run: gradle -p apps/android assembleDebug testDebugUnitTest lintDebug
      - name: Summarize Android lint errors
        if: always()
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path('apps/android/app/build/reports/lint-results-debug.xml')
          if report.exists():
              for issue in ET.parse(report).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      print(issue.get('id'), issue.get('message'))
                      for location in issue.findall('location'):
                          print(location.get('file'), 'line', location.get('line'))
          PY
      - name: Run export and Android share tests
        run: |
          python -m unittest discover -s tests -p "test_media_export.py" -v
          python -m unittest -v test_p174_android_share_pipeline.py
          python -m unittest discover -s tests -p "test_android_*.py" -v

      - name: Verify APK signature and record provenance
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android/app/build/outputs/apk/debug/app-debug.apk
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          apk = pathlib.Path('apps/android/app/build/outputs/apk/debug/app-debug.apk')
          sha = hashlib.sha256(apk.read_bytes()).hexdigest()
          (apk.parent / 'SHA256SUMS.txt').write_text(sha + '  app-debug.apk\n')
          (apk.parent / 'build-provenance.json').write_text(json.dumps({
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'apk': apk.name, 'sha256': sha, 'build_type': 'debug',
              'application_id': 'com.vidgravity.app', 'version_code': 181,
              'version_name': '1.2.0-sprint3',
              'emulator_validation': 'See API35 smoke job; Android 17/API37.2 unverified'
          }, indent=2) + '\n')
          PY
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidgravity-android-check-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          if-no-files-found: warn
      - name: Upload Android debug APK for device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vidgravity-android-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            apps/android/app/build/outputs/apk/debug/build-provenance.json
          if-no-files-found: error
          retention-days: 14


  android-ui-smoke:
    name: Android API 35 startup and navigation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate synthetic native-render fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python scripts/generate_native_studio_fixtures.py
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run automated launch, navigation and image preview tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android_ui_smoke.sh
      - name: Upload automated UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidgravity-android-api35-smoke-evidence
          path: |
            work/android-smoke/
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14


  android17-compatibility:
    name: Android 17 image discovery and optional UI/render validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Discover published Android 17 emulator images
        id: platform
        run: |
          mkdir -p work/android-smoke
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list > work/android-smoke/sdk-catalog.txt
          python - <<'PY'
          import os, pathlib
          catalog = pathlib.Path('work/android-smoke/sdk-catalog.txt').read_text()
          levels = ('37.2', '37')
          selected = next((level for level in levels if 'system-images;android-' + level + ';google_apis;x86_64' in catalog), '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('level=' + selected + '\n')
          message = ('ANDROID17_IMAGE_AVAILABLE api=' + selected) if selected else 'ANDROID17_VALIDATION_BLOCKED: no published API37/37.2 google_apis x86_64 image in SDK catalog'
          print(message)
          pathlib.Path('work/android-smoke/android17-status.txt').write_text(message + '\n')
          PY
      - uses: gradle/actions/setup-gradle@v4
        if: steps.platform.outputs.level != ''
        with:
          gradle-version: "8.10.2"
      - name: Generate synthetic native-render fixtures
        if: steps.platform.outputs.level != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python scripts/generate_native_studio_fixtures.py
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run published Android 17 image checks
        if: steps.platform.outputs.level != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.platform.outputs.level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/android_ui_smoke.sh
      - name: Upload Android 17 availability and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidgravity-android17-compatibility-evidence
          path: |
            work/android-smoke/
            apps/android/app/build/reports/androidTests/
            apps/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
