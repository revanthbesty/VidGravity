name: VidGravity Android Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  signed-release:
    name: Build signed Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate protected signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository/environment secret $name is missing. Configure the Android release-signing secrets before requesting a production APK."
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/vidgravity-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vidgravity-signing/release.jks"
          test -s "$RUNNER_TEMP/vidgravity-signing/release.jks"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vidgravity-signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p apps/android clean assembleRelease
      - name: Verify release APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK" | tee android-release-sha256.txt
      - name: Upload signed release APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: vidgravity-android-signed-release-p179
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            android-release-sha256.txt
          if-no-files-found: error
          retention-days: 30
