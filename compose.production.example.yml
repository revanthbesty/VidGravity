# Example only: configure a real HTTPS reverse proxy and container network before exposure.
services:
  vidgravity:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "5173"
    environment:
      # Keep false; never enable private/local URL access in production.
      VIDGRAVITY_PROVIDER_EGRESS_ISOLATED: "false"
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    # Do not publish ports directly to the internet. Route through a reverse proxy with HTTPS,
    # authentication, rate limiting, and a restrictive egress policy.
